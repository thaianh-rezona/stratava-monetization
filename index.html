<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Stratava Mini Games Monetization</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #f1f0ec;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --accent: #2a78d6;
    --accent-wash: rgba(42, 120, 214, 0.10);
    --mark-dim: #c3c2b7;
    --good: #006300;
    --bad: #d03b3b;
    --s1: #2a78d6;
    --s2: #eb6834;
    --s3: #1baf7a;
    --s4: #eda100;
    --shadow: 0 6px 24px rgba(11, 11, 11, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --surface-2: #242422;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --accent: #3987e5;
      --accent-wash: rgba(57, 135, 229, 0.16);
      --mark-dim: #4a4a46;
      --good: #0ca30c;
      --bad: #e66767;
      --s1: #3987e5;
      --s2: #d95926;
      --s3: #199e70;
      --s4: #c98500;
      --shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #242422;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-wash: rgba(57, 135, 229, 0.16);
    --mark-dim: #4a4a46;
    --good: #0ca30c;
    --bad: #e66767;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- Password gate ---------- */
  .gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .gate-card {
    width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px 24px; box-shadow: var(--shadow);
  }
  .gate-card h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .gate-card p { color: var(--ink-2); margin: 0 0 20px; font-size: 13px; }
  .gate-card label.field { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
  .gate-card input[type=password] {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--axis);
    background: var(--page); outline: none;
  }
  .gate-card input[type=password]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
  .remember { display: flex; gap: 8px; align-items: center; margin: 12px 0 18px; font-size: 13px; color: var(--ink-2); }
  .btn-primary {
    width: 100%; border: 0; border-radius: 10px; padding: 10px 14px; background: var(--accent);
    color: #fff; font-weight: 600;
  }
  .btn-primary:disabled { opacity: .6; cursor: progress; }
  .gate-error { color: var(--bad); font-size: 13px; min-height: 18px; margin-top: 10px; }

  /* ---------- Layout ---------- */
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  .topbar { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; }
  .topbar h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .meta span + span::before { content: "·"; margin: 0 6px; }
  .btn-ghost {
    background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px;
    color: var(--ink-2); white-space: nowrap;
  }
  .btn-ghost:hover { background: var(--surface-2); }

  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
  .seg { display: inline-flex; flex-wrap: wrap; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button {
    border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; color: var(--ink-2); font-size: 13px;
  }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .range-note { color: var(--muted); font-size: 13px; }
  .select { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px 10px; }

  /* ---------- Stat tiles ---------- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
    min-width: 0; text-align: left;
  }
  .tile.hero { grid-column: span 2; }
  .kpis.cols3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tile .label { color: var(--ink-2); font-size: 13px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .tile .value { font-size: 24px; font-weight: 600; margin-top: 6px; letter-spacing: -0.01em; line-height: 1.15; overflow-wrap: anywhere; }
  .tile.hero .value { font-size: 48px; letter-spacing: -0.02em; }
  .tile .sub { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .delta { font-size: 12px; margin-top: 6px; color: var(--muted); }
  .delta b { font-weight: 600; }
  .delta.up b { color: var(--good); }
  .delta.down b { color: var(--bad); }
  .tag {
    display: inline-block; font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 999px;
    background: var(--surface-2); color: var(--ink-2); vertical-align: middle;
  }
  button.tile { cursor: pointer; font: inherit; color: inherit; }
  button.tile:hover { border-color: var(--axis); }
  button.tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; background: linear-gradient(var(--accent-wash), var(--accent-wash)), var(--surface); }

  /* ---------- Cards ---------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; min-width: 0; }
  .card-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
  .card-head h2 { font-size: 15px; font-weight: 600; margin: 0; }
  .card-head .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .card-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chips { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .chips button {
    border: 1px solid var(--border); background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--ink-2);
  }
  .chips button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .link-btn { border: 0; background: none; color: var(--accent); font-size: 12px; padding: 4px 2px; }

  .chart { position: relative; width: 100%; }
  .chart svg { display: block; overflow: visible; }
  .chart .grid { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
  .chart .base { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
  .chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart .hit { fill: transparent; outline: none; }
  .chart .cross { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
  .legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  .empty { color: var(--muted); font-size: 13px; padding: 28px 0; text-align: center; }

  .tooltip {
    position: fixed; z-index: 10; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--shadow); padding: 8px 10px; font-size: 12px; min-width: 140px;
  }
  .tooltip .t-date { color: var(--muted); margin-bottom: 4px; }
  .tooltip .t-row { display: flex; align-items: center; gap: 8px; }
  .tooltip .t-row i { width: 12px; border-top: 2px solid; border-radius: 2px; }
  .tooltip .t-row b { font-weight: 600; color: var(--ink); }
  .tooltip .t-row span { color: var(--ink-2); }

  /* ---------- Tables ---------- */
  .table-wrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th button { border: 0; background: none; padding: 0; color: inherit; font: inherit; }
  th button[aria-sort]::after { content: " ↓"; }
  th button[aria-sort="ascending"]::after { content: " ↑"; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover, tbody tr.clickable:focus-visible { background: var(--surface-2); outline: none; }
  tbody tr:last-child td { border-bottom: 0; }
  .game-cell { display: flex; align-items: center; gap: 10px; min-width: 200px; }
  .icon { width: 32px; height: 32px; border-radius: 8px; background: var(--surface-2); flex: none; object-fit: cover; }
  .game-cell .nm { font-weight: 500; }
  .game-cell .sm { color: var(--muted); font-size: 12px; }
  .spark { display: block; }

  /* ---------- Game view ---------- */
  .back { margin-bottom: 14px; }
  .game-head { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
  .game-head .icon { width: 56px; height: 56px; border-radius: 14px; }
  .game-head h1 { font-size: 22px; font-weight: 600; margin: 0; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #0ca30c; }
  .tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--grid); margin-bottom: 14px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    border: 0; background: none; padding: 8px 0 10px; color: var(--ink-2); font-size: 14px; border-bottom: 2px solid transparent;
    margin-bottom: -1px; white-space: nowrap;
  }
  .tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
  .subtabs { margin-bottom: 14px; }
  .notice { color: var(--muted); font-size: 12px; margin: 4px 0 16px; }
  .err { color: var(--bad); }
  footer { color: var(--muted); font-size: 12px; margin-top: 28px; line-height: 1.6; }

  @media (max-width: 640px) {
    .tile.hero { grid-column: 1 / -1; }
    .kpis.cols3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tile.hero .value { font-size: 40px; }
    .topbar { flex-direction: column; }
  }
</style>
</head>
<body>

<section class="gate" id="gate">
  <form class="gate-card" id="gate-form" autocomplete="off">
    <h1>Stratava Mini Games Monetization</h1>
    <p>This dashboard is private. Enter the password you were given.</p>
    <label class="field" for="pw">Password</label>
    <input type="password" id="pw" name="password" autocomplete="current-password" required autofocus>
    <label class="remember"><input type="checkbox" id="remember"> Remember on this device</label>
    <button class="btn-primary" id="unlock" type="submit">Unlock</button>
    <div class="gate-error" id="gate-error" role="alert"></div>
  </form>
</section>

<div id="app" hidden>
  <div class="wrap">
    <header class="topbar">
      <div>
        <h1 id="title"></h1>
        <div class="meta" id="meta"></div>
      </div>
      <button class="btn-ghost" id="lock" type="button">Lock</button>
    </header>
    <div class="filters" id="filters"></div>
    <main id="main"></main>
    <footer id="footer"></footer>
  </div>
</div>
<div class="tooltip" id="tooltip" hidden></div>

// ---------------------------------------------------------------- decryption
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  const bits = await crypto.subtle.deriveBits(

}

const NBSP = " ";
function fmt(v, kind, axis) {
  if (v == null || Number.isNaN(v)) return "—";
  const a = Math.abs(v);
  if (kind === "usd") {
    if (a >= 1e6) return "$" + (v / 1e6).toFixed(a >= 1e7 ? 1 : 2) + "M";
    if (a >= 1e4 || (axis && a >= 1e3)) return "$" + (v / 1e3).toFixed(a >= 1e5 || axis ? 0 : 1) + "K";
    if (axis) return "$" + (Number.isInteger(v) ? v : v.toFixed(2));
    return "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  if (kind === "pct") {
    const p = v * 100;
    return (axis ? +p.toFixed(1) : p.toFixed(p !== 0 && Math.abs(p) < 10 ? 2 : 1)) + "%";
  }
  if (a >= 1e6) return (v / 1e6).toFixed(1) + "M";
  if (a >= 1e5 || (axis && a >= 1e3)) return (v / 1e3).toFixed(axis ? 0 : 1) + "K";
  return Math.round(v).toLocaleString("en-US");
}

const dShort = (d) => MONTHS[+d.slice(5, 7) - 1] + " " + +d.slice(8, 10);
const dLong = (d) => dShort(d) + ", " + d.slice(0, 4);

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}

let PERIODS = [];
const period = () => PERIODS.find((p) => p.key === state.period) || PERIODS[0];

function setupPeriods() {
  PERIODS = D.periods.map((p) => ({ ...p }));
  const starts = D.games.flatMap((g) => Object.values(g.history || {}).filter(Boolean).map((hh) => hh.start)).sort();
  const end = PERIODS[0].end;
  PERIODS.push({ key: "all", label: "All time", start: starts[0] || PERIODS[PERIODS.length - 1].start, end });

// ----- per-game accessors
function histValue(g, metric, date) {
  const hh = g.history && g.history[state.region];
  if (!hh || !hh.series[metric]) return null;
  const i = dayDiff(hh.start, date);
  const v = hh.series[metric][i];

}

  if (m.add) return histSum(g, m.k, start, end);
  if (m.ratio) {
    const [num, den, mul] = m.ratio;
    const a = histSum(g, num, start, end), b = histSum(g, den, start, end);
    return a == null || b == null ? null : (b ? (a / b) * mul : 0);

  const m = METRIC[key];
  if (p.key === "all") return sumOverRange(g, m, p.start, p.end);
  const t = totals(g, p);
  if (m.k === "ads_click_rate") { const v = t.iaa; return v.ads_exposure ? (v.ads_click || 0) / v.ads_exposure : (v.ads_exposure === 0 ? 0 : null); }

function readiness(g, key, p = period()) {
  if (p.key === "all") return null;
  const m = METRIC[key];
  const ready = totals(g, p).ready[m.data];
  const r = ready && ready[m.k];
  if (!r) return null;

}
function delta(valueAt, p = period()) {

  if (prev === 0) return cur > 0 ? { text: "new", dir: "up", label } : null;
  const pct = (cur - prev) / Math.abs(prev);
  return { text: (pct > 0 ? "+" : "") + (pct * 100).toFixed(Math.abs(pct) < 0.1 ? 1 : 0) + "%", dir: pct > 0 ? "up" : pct < 0 ? "down" : "flat", label };
}

// ----- portfolio (all live games)
function portfolioValue(key, p = period()) {
  const m = METRIC[key];
  const games = liveGames();
  if (m.ratio) {
    const [num, den, mul] = m.ratio;
    const a = portfolioValue(m.sec + "." + num, p), b = portfolioValue(m.sec + "." + den, p);
    return a == null || b == null ? null : (b ? (a / b) * mul : 0);
  }
  let sum = null;
  for (const g of games) { const v = gameValue(g, key, p); if (v != null) sum = (sum || 0) + v; }
  return sum;
}
function portfolioRange(key, start, end) {
  const m = METRIC[key];
  if (m.ratio) {
    const [num, den, mul] = m.ratio;
    const a = portfolioRange(m.sec + "." + num, start, end), b = portfolioRange(m.sec + "." + den, start, end);
    return a == null || b == null ? null : (b ? (a / b) * mul : 0);
  }
  let sum = null;
  for (const g of liveGames()) { const v = histSum(g, m.k, start, end); if (v != null) sum = (sum || 0) + v; }
  return sum;
}

// ----- chart windows: a single day gets two weeks of context, the day itself emphasized
function chartWindow(p = period()) {

  return { start: p.start, end: p.end, emphasizeLast: false };

function datesBetween(start, end) { const out = []; for (let d = start; d <= end; d = addDays(d, 1)) out.push(d); return out; }
function dailySeries(g, dataKey, metricKey, dates) {
  const daily = g.data[state.region].daily;
  const m = METRIC[Object.keys(METRIC).find((k) => METRIC[k].data === dataKey && METRIC[k].k === metricKey)] || { k: metricKey };
  return dates.map((d) => {
    if (m.add) return histValue(g, metricKey, d);
    if (m.ratio) { const [num, den, mul] = m.ratio; const a = histValue(g, num, d), b = histValue(g, den, d); return a == null || b == null ? null : (b ? (a / b) * mul : 0); }
    if (!daily || !daily[dataKey] || !daily[dataKey][metricKey]) return null;
    const i = dayDiff(daily.start, d);

}

// ---------------------------------------------------------------- charts
function niceScale(max, integer) {
  if (!(max > 0)) return { max: integer ? 4 : 1, step: integer ? 1 : 0.25 };
  const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  let step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  if (integer) step = Math.max(1, Math.ceil(step));
  return { max: step * Math.ceil(max / step - 1e-9), step };
}

// cfg: { type: "column" | "line", dates, series: [{ name, color, values }], f, emphasizeLast, label }
function renderChart(host, cfg) {
  host.replaceChildren();
  const W = Math.max(280, host.clientWidth || 600), H = cfg.height || 240;
  const all = cfg.series.flatMap((x) => x.values).filter((v) => v != null);
  const sc = niceScale(all.length ? Math.max(...all) : 0, cfg.f === "int");
  const ticks = [];
  for (let v = 0; v <= sc.max + sc.step / 1e6; v += sc.step) ticks.push(+v.toFixed(10));
  const ml = Math.max(...ticks.map((t) => fmt(t, cfg.f, true).length)) * 6.6 + 14, mr = 10, mt = 10, mb = 26;
  const iw = W - ml - mr, ih = H - mt - mb, n = cfg.dates.length, band = iw / Math.max(1, n);
  const X = (i) => ml + band * (i + 0.5);
  const Y = (v) => mt + ih - (v / sc.max) * ih;
  const base = mt + ih;
  const svg = s("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": cfg.label });

  for (const t of ticks) {
    svg.append(s("line", { class: t === 0 ? "base" : "grid", x1: ml, x2: W - mr, y1: Math.round(Y(t)) + 0.5, y2: Math.round(Y(t)) + 0.5 }));
    const tx = s("text", { x: ml - 8, y: Y(t) + 4, "text-anchor": "end" });
    tx.textContent = fmt(t, cfg.f, true);
    svg.append(tx);
  }
  const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 70))));
  for (let i = 0; i < n; i++) {
    if ((n - 1 - i) % every !== 0) continue; // anchor labels on the latest day
    const tx = s("text", { x: X(i), y: H - 8, "text-anchor": "middle" });
    tx.textContent = dShort(cfg.dates[i]);
    svg.append(tx);
  }

  const marks = [];
  if (cfg.type === "column") {
    const bw = Math.max(2, Math.min(24, band * 0.72, band - 2));
    const color = cfg.series[0].color;
    cfg.series[0].values.forEach((v, i) => {
      if (!(v > 0)) { marks.push(null); return; }
      const x0 = X(i) - bw / 2, y0 = Math.min(Y(v), base - 1), r = Math.min(4, bw / 2, base - y0);
      const d = `M${x0},${base}V${y0 + r}Q${x0},${y0} ${x0 + r},${y0}H${x0 + bw - r}Q${x0 + bw},${y0} ${x0 + bw},${y0 + r}V${base}Z`;
      const dim = cfg.emphasizeLast && i !== n - 1;
      const path = s("path", { d, fill: dim ? "var(--mark-dim)" : color });
      svg.append(path);
      marks.push(path);
    });
  } else {
    const single = cfg.series.length === 1;
    for (const ser of cfg.series) {
      let d = "", area = "", started = false, lastI = -1, firstI = -1;
      ser.values.forEach((v, i) => {
        if (v == null) { started = false; return; }
        d += (started ? "L" : "M") + X(i).toFixed(1) + "," + Y(v).toFixed(1);
        if (firstI < 0) firstI = i;
        started = true; lastI = i;
      });
      if (single && firstI >= 0) {
        const pts = ser.values.map((v, i) => (v == null ? null : X(i).toFixed(1) + "," + Y(v).toFixed(1))).filter(Boolean);
        area = "M" + X(firstI).toFixed(1) + "," + base + "L" + pts.join("L") + "L" + X(lastI).toFixed(1) + "," + base + "Z";
        svg.append(s("path", { d: area, fill: ser.color, "fill-opacity": 0.1, stroke: "none" }));
      }
      if (d) svg.append(s("path", { d, fill: "none", stroke: ser.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
      if (lastI >= 0) svg.append(s("circle", { cx: X(lastI), cy: Y(ser.values[lastI]), r: 4, fill: ser.color, stroke: "var(--surface)", "stroke-width": 2 }));
    }
  }

  // Hover / keyboard layer: the whole plot is the hit target, snapping to the nearest day.
  const cross = s("line", { class: "cross", y1: mt, y2: base, visibility: "hidden" });
  const dots = cfg.series.map((ser) => s("circle", { r: 4, fill: ser.color, stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }));
  if (cfg.type === "line") svg.append(cross, ...dots);
  const hit = s("rect", { class: "hit", x: ml, y: mt, width: iw, height: ih, tabindex: 0, "aria-label": cfg.label + ". Use arrow keys to read values." });
  svg.append(hit);
  let cur = -1;
  const show = (i, cx, cy) => {
    cur = Math.max(0, Math.min(n - 1, i));
    if (cfg.type === "line") {
      cross.setAttribute("x1", X(cur)); cross.setAttribute("x2", X(cur)); cross.setAttribute("visibility", "visible");
      cfg.series.forEach((ser, k) => {
        const v = ser.values[cur];
        dots[k].setAttribute("visibility", v == null ? "hidden" : "visible");
        if (v != null) { dots[k].setAttribute("cx", X(cur)); dots[k].setAttribute("cy", Y(v)); }
      });
    } else {
      marks.forEach((m, k) => m && m.setAttribute("opacity", k === cur ? 1 : 0.55));
    }
    const rect = svg.getBoundingClientRect();
    showTip(cx ?? rect.left + X(cur), cy ?? rect.top + mt + 20, dLong(cfg.dates[cur]),
      cfg.series.map((ser) => ({ color: ser.color, value: fmt(ser.values[cur], cfg.f), name: cfg.series.length > 1 ? ser.name : null })));
  };
  const clear = () => { cur = -1; cross.setAttribute("visibility", "hidden"); dots.forEach((d) => d.setAttribute("visibility", "hidden")); marks.forEach((m) => m && m.removeAttribute("opacity")); hideTip(); };
  hit.addEventListener("pointermove", (e) => { const r = svg.getBoundingClientRect(); show(Math.floor((e.clientX - r.left - ml) / band), e.clientX, e.clientY); });
  hit.addEventListener("pointerleave", clear);
  hit.addEventListener("blur", clear);
  hit.addEventListener("focus", () => show(n - 1));
  hit.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); show((cur < 0 ? n - 1 : cur) + (e.key === "ArrowLeft" ? -1 : 1)); }
    if (e.key === "Escape") clear();
  });
  host.append(svg);
}

function sparkline(values) {
  const W = 96, H = 28, pad = 3;
  const svg = s("svg", { width: W, height: H, class: "spark", "aria-hidden": "true" });
  const vals = values.map((v) => v || 0);
  const max = Math.max(...vals, 0) || 1;
  const X = (i) => pad + (i * (W - pad * 2)) / Math.max(1, vals.length - 1);
  const Y = (v) => H - pad - (v / max) * (H - pad * 2);
  svg.append(s("polyline", { points: vals.map((v, i) => X(i).toFixed(1) + "," + Y(v).toFixed(1)).join(" "), fill: "none", stroke: "var(--muted)", "stroke-width": 1.5, "stroke-linejoin": "round" }));
  const li = vals.length - 1;

  const dates = datesBetween(win.start, win.end);
  const colors = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)"];
  main.append(chartCard("game-" + state.section, m.label,
    win.emphasizeLast ? "Last 14 days, " + dShort(p.end) + " highlighted" : rangeLabel(win), null,
    () => ({
      type: "line", f: m.f, dates, label: m.label + " per day for " + g.name,
      series: m.lines
        ? m.lines.map(([k, name], i) => ({ name, color: colors[i], values: dailySeries(g, m.data, k, dates) }))
        : [{ name: m.label, color: "var(--s1)", values: dailySeries(g, m.data, m.k, dates) }],
    })));

  if (state.section === "orders") {
    const t = totals(g, p.key === "all" ? PERIODS.find((x) => x.key === "last90") : p);
    const list = t.top || [];
    main.append(h("section", { class: "card" },
      h("div", { class: "card-head" }, h("div", {}, h("h2", { text: "Top 10 products" }),
        h("div", { class: "sub", text: p.key === "all" ? "Last 90 days (the longest range the portal provides)" : rangeLabel(p) }))),
      list.length
        ? h("div", { class: "table-wrap" }, h("table", {},
            h("thead", {}, h("tr", {}, h("th", { text: "#" }), h("th", { text: "Product" }), h("th", { class: "num", text: "Sales" }))),
            h("tbody", {}, list.map((r, i) => h("tr", {}, h("td", { text: String(i + 1) }), h("td", { text: r.name }), h("td", { class: "num", text: fmt(r.sales, "int") }))))))
        : h("p", { class: "empty", text: "No product sales in this period." })));
  }

  main.append(h("p", { class: "notice", text: "Live in " + regions.length + " countries: " + regions.map((c) => regionNames.of(c) || c).join(", ") + "." }));
}

function renderFooter() {
  const regions = [...new Set(D.games.flatMap((g) => Object.keys(g.data || {})))];
  document.getElementById("footer").replaceChildren(
    h("div", { text: "Source: TikTok for Developers portal → each game's Monetization page (In-App Ads: Business insight, all ad placements; In-App Purchases: Users and Orders, all operating systems)." }),
    h("div", { text: regions.length === 1 ? "Data region: " + REGION_LABEL[regions[0]] + ", all countries. None of the live games run in the US or EU/UK data regions." : "Each data region (US, EU & UK, Rest of the world) is reported separately, as in the portal." }),
    h("div", { text: "Dates are calendar days ending yesterday. \"Pending\" means TikTok has not processed any of that range yet; \"Partial\" means the latest day is still processing, so the figure may still go up." }),
  );
}

function render() {
  resizers = [];
  hideTip();
  renderHeader();
  const main = document.getElementById("main");
  main.replaceChildren();
  const m = location.hash.match(/^#\/game\/(\d+)/);
  if (m) renderGame(main, m[1]); else renderOverview(main);
  renderFooter();
}

let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => resizers.forEach((f) => f()), 120); });
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

// ---------------------------------------------------------------- boot
function start(data) {
  D = data;
  setupPeriods();
  document.title = D.title;
  document.getElementById("gate").hidden = true;
  document.getElementById("app").hidden = false;
  render();
}

document.getElementById("lock").addEventListener("click", () => { store.clear(); location.hash = ""; location.reload(); });

document.getElementById("gate-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("unlock"), err = document.getElementById("gate-error");
  const pw = document.getElementById("pw").value;
  if (!ENVELOPE) { err.textContent = "No data has been built into this page yet."; return; }
  btn.disabled = true; btn.textContent = "Unlocking…"; err.textContent = "";
  try {
    const bits = await deriveBits(pw);
    const data = await openEnvelope(bits);
    store.set(toB64(bits), document.getElementById("remember").checked);
    start(data);
  } catch (ex) {
    err.textContent = "Wrong password. Try again.";
    btn.disabled = false; btn.textContent = "Unlock";
  }
});

(async () => {
  const saved = ENVELOPE && store.get();
  if (!saved) return;
  try { start(await openEnvelope(b64(saved))); } catch (e) { store.clear(); }
})();
</script>
